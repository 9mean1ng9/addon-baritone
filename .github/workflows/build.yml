name: Build Forge Mod
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Download Baritone API
        run: |
          mkdir -p libs
          curl -sSL -L -o libs/baritone-api.jar https://github.com/cabaletta/baritone/releases/download/v1.2.14/baritone-api-1.2.14.jar
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineDest-Addon
          path: build/libs/*.jar
